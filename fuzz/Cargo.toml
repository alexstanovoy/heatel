# Coverage-guided fuzz targets for every reader of Valve's formats: VPK packages, resources,
# KV3, NTRO, textures, sounds, models, meshes, animations, materials, worlds, entity lumps,
# and the tooltip, shop and portrait scripts, with the glTF, KTX2 and PNG writers they feed.
# A workspace of its own: the fuzzer's flags and libFuzzer stay out of the main build.
# `fuzz.sh` builds and runs them on stable Rust.
[package]
name = "heatel_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# glTF validation, with the extensions the writer uses.
gltf = { version = "1.4.0", default-features = false, features = [
    "KHR_lights_punctual",
    "KHR_materials_transmission",
    "KHR_materials_ior",
    "KHR_materials_volume",
    "KHR_materials_unlit",
    "KHR_materials_emissive_strength",
    "KHR_texture_transform",
    "extras",
    "extensions",
    "names",
    "utils",
] }
heatel = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1"

[workspace]
members = ["."]

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "vpk"
path = "fuzz_targets/vpk.rs"
test = false
doc = false
bench = false

